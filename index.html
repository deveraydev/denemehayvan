<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap ve Kayıt Ol</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="auth-wrapper">
    
    <!-- GİRİŞ FORMU -->
    <div id="login-card" class="card">
      <h2>Giriş Yap</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">E-Posta Adresi</label>
          <input type="email" id="login-email" placeholder="ornek@email.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Şifre</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Giriş Yap</button>
      </form>
      <p class="toggle-text">
        Hesabınız yok mu? <a href="#" id="go-to-register">Kayıt Ol</a>
      </p>
    </div>

    <!-- KAYIT FORMU -->
    <div id="register-card" class="card hidden">
      <h2>Kayıt Ol</h2>
      <form id="register-form">
        <div class="form-group">
          <label for="reg-username">Kullanıcı Adı</label>
          <input type="text" id="reg-username" placeholder="kullaniciadi" required>
        </div>
        <div class="form-group">
          <label for="reg-email">E-Posta Adresi</label>
          <input type="email" id="reg-email" placeholder="ornek@email.com" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Şifre</label>
          <input type="password" id="reg-password" placeholder="En az 6 karakter" minlength="6" required>
        </div>
        <div class="form-group">
          <label for="reg-fullname">Ad Soyad</label>
          <input type="text" id="reg-fullname" placeholder="Ad Soyad" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="reg-city">İl</label>
            <input type="text" id="reg-city" placeholder="İzmir" required>
          </div>
          <div class="form-group">
            <label for="reg-district">İlçe</label>
            <input type="text" id="reg-district" placeholder="Konak" required>
          </div>
        </div>
        <div class="form-group">
          <label for="reg-tc">TC Kimlik No</label>
          <input type="text" id="reg-tc" placeholder="11 Haneli TC No" maxlength="11" pattern="\d{11}" required>
        </div>
        <div class="form-group">
          <label for="reg-phone">Telefon Numarası</label>
          <input type="tel" id="reg-phone" placeholder="05XXXXXXXXX" required>
        </div>
        <div class="form-group">
          <label for="reg-avatar">Profil Resmi</label>
          <input type="file" id="reg-avatar" accept="image/*" required>
        </div>
        <button type="submit" id="reg-btn" class="btn">Kayıt Ol</button>
      </form>
      <p class="toggle-text">
        Zaten hesabınız var mı? <a href="#" id="go-to-login">Giriş Yap</a>
      </p>
    </div>

    <!-- GİRİŞ SONRASI HOŞ GELDİN KARTI -->
    <div id="dashboard-card" class="card hidden">
      <div class="profile-header">
        <img id="user-avatar" src="" alt="Profil Resmi" class="avatar-img">
        <h2 id="user-name">Hoş Geldiniz</h2>
        <p id="user-email" class="sub-text"></p>
      </div>
      <div class="profile-details">
        <p><strong>Kullanıcı Adı:</strong> <span id="info-username"></span></p>
        <p><strong>TC No:</strong> <span id="info-tc"></span></p>
        <p><strong>Telefon:</strong> <span id="info-phone"></span></p>
        <p><strong>Konum:</strong> <span id="info-location"></span></p>
      </div>
      <button id="logout-btn" class="btn btn-secondary">Çıkış Yap</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
