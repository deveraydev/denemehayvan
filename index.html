<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatiFon Mobile - Hayvan Destek Platformu</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#FF7A00',
                            cream: '#FFF9F5',
                            green: '#2E7D32',
                            brown: '#5D4037',
                            softBg: '#F8F9FA'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased selection:bg-brand-orange selection:text-white">

    <!-- Main Container -->
    <div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-2xl relative flex flex-col pb-20">
        
        <!-- Top Header -->
        <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-gray-100 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-brand-orange flex items-center justify-center text-white font-bold text-lg">P</div>
                <span class="font-black text-xl tracking-tight text-gray-900">Pati<span class="text-brand-orange">Fon</span></span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openCartModal()" class="p-2 rounded-full hover:bg-gray-100 text-gray-600 relative transition" title="Sepetim">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                    <span id="cart-badge" class="absolute -top-0.5 -right-0.5 w-4 h-4 bg-brand-orange text-white text-[10px] font-bold rounded-full flex items-center justify-center hidden">0</span>
                </button>
                <button onclick="switchTab('admin')" class="p-2 rounded-full hover:bg-gray-100 text-gray-600 transition" title="Admin Yönetimi">
                    <i data-lucide="shield-alert" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <!-- View 1: Auth (Giriş / Kayıt Ekranları) -->
        <section id="view-auth" class="p-6 flex-1 flex flex-col justify-center">
            
            <!-- GİRİŞ FORMU KARTI -->
            <div id="auth-login-card" class="space-y-4">
                <div class="text-center mb-6">
                    <div class="w-20 h-20 bg-brand-cream text-brand-orange rounded-3xl mx-auto flex items-center justify-center mb-4 shadow-inner">
                        <i data-lucide="heart-handshake" class="w-10 h-10"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-900">PatiFon'a Hoş Geldiniz</h2>
                    <p class="text-sm text-gray-500 mt-1">Sokaktaki canlara umut olmak için giriş yapın.</p>
                </div>

                <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">E-Posta Adresi</label>
                        <input type="email" id="login-email" placeholder="ornek@email.com" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-orange/50 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Şifre</label>
                        <input type="password" id="login-password" placeholder="••••••••" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-orange/50 transition">
                    </div>
                    <button type="submit" id="btn-login" class="w-full py-3.5 bg-brand-orange hover:bg-orange-600 text-white font-bold rounded-xl shadow-lg shadow-orange-500/20 transition active:scale-95">Giriş Yap</button>
                </form>

                <p class="text-xs text-center text-gray-500 mt-4">
                    Hesabınız yok mu? 
                    <button type="button" onclick="toggleAuthMode('register')" class="text-brand-orange font-bold hover:underline bg-transparent border-0 cursor-pointer">Kayıt Ol</button>
                </p>
            </div>

            <!-- KAYIT OL FORMU KARTI -->
            <div id="auth-register-card" class="space-y-4 hidden">
                <div class="text-center mb-4">
                    <h2 class="text-2xl font-bold text-gray-900">Aramıza Katılın</h2>
                    <p class="text-xs text-gray-500 mt-1">Sokak canlılarımızın koruyucusu olun.</p>
                </div>

                <form id="register-form" class="space-y-3" onsubmit="handleRegister(event)">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">Kullanıcı Adı</label>
                        <input type="text" id="reg-username" placeholder="kullaniciadi" required class="w-full px-3 py-2.5 text-sm rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-orange/50">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">E-Posta Adresi</label>
                        <input type="email" id="reg-email" placeholder="ornek@email.com" required class="w-full px-3 py-2.5 text-sm rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-orange/50">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">Şifre</label>
                        <input type="password" id="reg-password" placeholder="En az 6 karakter" minlength="6" required class="w-full px-3 py-2.5 text-sm rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-orange/50">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">Ad Soyad</label>
                        <input type="text" id="reg-fullname" placeholder="Ad Soyad" required class="w-full px-3 py-2.5 text-sm rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-orange/50">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">İl</label>
                            <input type="text" id="reg-city" placeholder="İzmir" required class="w-full px-3 py-2.5 text-sm rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-orange/50">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">İlçe</label>
                            <input type="text" id="reg-district" placeholder="Konak" required class="w-full px-3 py-2.5 text-sm rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-orange/50">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">TC Kimlik No</label>
                        <input type="text" id="reg-tc" placeholder="11 Haneli TC No" maxlength="11" pattern="\d{11}" required class="w-full px-3 py-2.5 text-sm rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-orange/50">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">Telefon Numarası</label>
                        <input type="tel" id="reg-phone" placeholder="05XXXXXXXXX" required class="w-full px-3 py-2.5 text-sm rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-orange/50">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">Profil Resmi (İsteğe Bağlı)</label>
                        <input type="file" id="reg-avatar" accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-brand-cream file:text-brand-orange hover:file:bg-orange-100 border border-gray-200 rounded-xl">
                    </div>
                    <button type="submit" id="btn-register" class="w-full py-3.5 bg-brand-orange hover:bg-orange-600 text-white font-bold rounded-xl shadow-lg shadow-orange-500/20 transition active:scale-95 mt-2">Kayıt Ol</button>
                </form>

                <p class="text-xs text-center text-gray-500 mt-4">
                    Zaten hesabınız var mı? 
                    <button type="button" onclick="toggleAuthMode('login')" class="text-brand-orange font-bold hover:underline bg-transparent border-0 cursor-pointer">Giriş Yap</button>
                </p>
            </div>

        </section>

        <!-- View 2: Home Feed -->
        <section id="view-home" class="hidden flex-1 p-4 space-y-4">
            <div id="animal-feed-list" class="space-y-6"></div>
        </section>

        <!-- View 3: PetFon Store -->
        <section id="view-petfon" class="hidden flex-1 p-4 space-y-4">
            <div id="store-products-list" class="grid grid-cols-2 gap-3"></div>
        </section>

        <!-- View 4: Leaderboard -->
        <section id="view-leaderboard" class="hidden flex-1 p-4 space-y-4">
            <div id="global-leaderboard-list" class="space-y-3"></div>
        </section>

        <!-- View 5: Profile -->
        <section id="view-profile" class="hidden flex-1 p-4 space-y-6">
            <div class="flex items-center gap-4 bg-gray-50 p-4 rounded-2xl border border-gray-100">
                <img id="profile-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="w-16 h-16 rounded-full object-cover ring-2 ring-brand-orange">
                <div>
                    <h3 id="profile-name" class="font-bold text-gray-900 text-lg">Kullanıcı</h3>
                    <p id="profile-email" class="text-xs text-gray-500">kullanici@email.com</p>
                </div>
            </div>
            <button onclick="handleLogout()" class="w-full py-3 bg-red-50 text-red-600 font-bold text-sm rounded-xl border border-red-100 hover:bg-red-100 transition">Çıkış Yap</button>
        </section>

        <!-- View 6: Admin -->
        <section id="view-admin" class="hidden flex-1 p-4 space-y-4">
            <h2 class="font-bold text-lg text-gray-900">Yönetici Paneli</h2>
        </section>

        <!-- Bottom Navigation Bar -->
        <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-md border-t border-gray-200 px-4 py-2 flex justify-between items-center z-40 hidden">
            <button onclick="switchTab('home')" class="nav-item active flex flex-col items-center gap-0.5 text-brand-orange" id="nav-home">
                <i data-lucide="heart" class="w-5 h-5"></i>
                <span class="text-[10px] font-semibold">İlanlar</span>
            </button>
            <button onclick="switchTab('petfon')" class="nav-item flex flex-col items-center gap-0.5 text-gray-400" id="nav-petfon">
                <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                <span class="text-[10px] font-semibold">PetFon</span>
            </button>
            <button onclick="switchTab('leaderboard')" class="nav-item flex flex-col items-center gap-0.5 text-gray-400" id="nav-leaderboard">
                <i data-lucide="trophy" class="w-5 h-5"></i>
                <span class="text-[10px] font-semibold">Sıralama</span>
            </button>
            <button onclick="switchTab('profile')" class="nav-item flex flex-col items-center gap-0.5 text-gray-400" id="nav-profile">
                <i data-lucide="user" class="w-5 h-5"></i>
                <span class="text-[10px] font-semibold">Profilim</span>
            </button>
        </nav>

        <!-- Modals -->
        <div id="cart-modal" class="fixed inset-0 bg-black/60 z-50 flex items-end justify-center hidden">
            <div class="bg-white w-full max-w-md rounded-t-3xl p-6 space-y-4">
                <h3 class="font-bold text-gray-900 text-lg">Alışveriş Sepetim</h3>
                <div id="cart-items-container" class="space-y-2"></div>
                <button onclick="closeCartModal()" class="w-full py-3 bg-gray-200 rounded-xl font-bold">Kapat</button>
            </div>
        </div>

        <div id="donation-modal" class="fixed inset-0 bg-black/60 z-50 flex items-end justify-center hidden">
            <div class="bg-white w-full max-w-md rounded-t-3xl p-6 space-y-4">
                <h3 class="font-bold text-gray-900 text-lg">Destek Ol</h3>
                <p class="text-xs text-gray-500">Bağışınız için teşekkür ederiz.</p>
                <button onclick="closeDonationModal()" class="w-full py-3 bg-brand-orange text-white rounded-xl font-bold">Tamam</button>
            </div>
        </div>

    </div>

    <!-- Application Javascript -->
    <script src="app.js"></script>
</body>
</html>
